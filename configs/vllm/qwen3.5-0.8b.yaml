# vLLM serve settings for Qwen/Qwen3.5-0.8B, pinned for the study.
# Start it with scripts/serve.sh qwen3.5-0.8b. What each line is for: configs/README.md.
# Every value is a JSON literal, so YAML and ipb.runner.serving read this file the same way.
# tensor-parallel-size assumes 80 GB GPUs. Change it for yours, and keep it fixed for the whole study.
model: "Qwen/Qwen3.5-0.8B"
revision: "2fc06364715b967f1860aea9cf38778875588b17"
tokenizer-revision: "2fc06364715b967f1860aea9cf38778875588b17"
dtype: "bfloat16"
kv-cache-dtype: "auto"
max-model-len: 40960
tensor-parallel-size: 1
gpu-memory-utilization: 0.9
seed: 0
generation-config: "vllm"
no-enable-prefix-caching: true
enable-auto-tool-choice: true
tool-call-parser: "qwen3_coder"
reasoning-parser: "qwen3"
default-chat-template-kwargs: {"enable_thinking": false}
