# vLLM 0.28.0 serve settings for Qwen/Qwen3-32B, pinned for the study.
# Served at sm80-vllm0280, Gaurav's 80 GB cards, as a second copy of the 32B's last twelve main
# runs; the DGX-1 serves it with qwen3-32b.yaml. Start it with
# scripts/serve.sh --env sm80-vllm0280 qwen3-32b. What each line is for: configs/README.md.
# Every value is a JSON literal, so YAML and ipb.runner.serving read this file the same way.
# tensor-parallel-size assumes 80 GB GPUs: about 65 GB of bfloat16 weights fit on two with room
# for the KV cache. Keep it fixed for the whole study.
model: "Qwen/Qwen3-32B"
revision: "9216db5781bf21249d130ec9da846c4624c16137"
tokenizer-revision: "9216db5781bf21249d130ec9da846c4624c16137"
dtype: "bfloat16"
kv-cache-dtype: "auto"
max-model-len: 40960
tensor-parallel-size: 2
gpu-memory-utilization: 0.9
seed: 0
generation-config: "vllm"
no-enable-prefix-caching: true
enable-auto-tool-choice: true
tool-call-parser: "hermes"
reasoning-parser: "qwen3"
default-chat-template-kwargs: {"enable_thinking": false}
