# vLLM serve settings for openai/gpt-oss-20b, pinned for the study.
# Start it with scripts/serve.sh gpt-oss-20b, which also sets the environment this model needs.
# What each line is for: configs/README.md.
# Every value is a JSON literal, so YAML and ipb.runner.serving read this file the same way.
# tensor-parallel-size assumes 80 GB GPUs. Change it for yours, and keep it fixed for the whole study.
model: "openai/gpt-oss-20b"
revision: "6cee5e81ee83917806bbde320786a8fb61efebee"
tokenizer-revision: "6cee5e81ee83917806bbde320786a8fb61efebee"
dtype: "bfloat16"
kv-cache-dtype: "auto"
max-model-len: 40960
tensor-parallel-size: 1
gpu-memory-utilization: 0.9
seed: 0
generation-config: "vllm"
no-enable-prefix-caching: true
enable-auto-tool-choice: true
tool-call-parser: "openai"
