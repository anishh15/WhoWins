name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test suite
        run: python -m pytest -q tests/
      - name: Data checks
        run: |
          python -m whowins.validation.validate_collection
          python -m whowins.validation.check_batch
          python -m whowins.checkers.coverage
          python -m whowins.splits.check --no-log-file
